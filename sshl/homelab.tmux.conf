# sshl session config.
#
# Loaded by the launcher on a dedicated socket (`tmux -L homelab`), so
# nothing here affects your default tmux sessions. The server starts with
# `-f` pointing at this file, so ~/.tmux.conf is not read and the prefix
# is the tmux default, Ctrl+b.
#
# User options set by the launcher (accessible as #{@name}). Server-global
# so grouped sessions inherit them, since session-scoped options aren't
# shared across a session group:
#   @info_script     absolute path to host-info.sh                 [global]
#   @build_complete  1 once the launcher finished building         [global]
#   @host_ip         this window's remote IP                       [window]
#   @host_user       this window's SSH user                        [window]
#   @host_name       this window's resolved hostname               [window]
#
# Global environment set by the launcher, read by the popup bindings:
#   SSHL_DIR     directory holding the sshl scripts
#   SSHL_PICKER  absolute path to host-picker.sh

# When a pane's command exits non-zero (ssh drop, htop crash, etc.),
# keep the pane visible so the error message stays readable. Press
# `<prefix> r` to respawn. Successful exits close normally.
set -g remain-on-exit failed
set-hook -g pane-died "display-message 'pane died in ##W. Press <prefix> r to respawn.'"

# Respawn the pane AND kick a fresh host-info check. When a host
# reboots, ssh drops → pane is dead → you press `<prefix> r`. That's
# the natural "host is back, refresh everything" signal, so we also
# force-refresh uptime/updates (same action as the ↻ button).
bind-key r {
    respawn-pane -k
    run-shell -b "'#{@info_script}' -f '#{@host_user}' '#{@host_ip}' >/dev/null 2>&1"
    display-message "respawned + refreshing #{@host_name}…"
}

# The main-* layouts size the main pane with these. The defaults, 80
# columns and 24 rows, fill the 80x24 window a session is built in before
# any terminal attaches, and left the other pane one cell wide.
set -g main-pane-width 66%
set -g main-pane-height 66%

# Labels at the top of each pane. The launcher sets a title via
# `select-pane -T`: "ssh user@host" on the left, and on the right the first
# word of the right-pane command template (`ssh` for the default one).
# pane_current_command shows for a pane without a title.
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour208,bold"
set -g pane-border-format "#[align=centre,fg=colour244] #{pane_index} │ #{?pane_title,#{pane_title},#{pane_current_command}} "

# These bindings reference shell variables ($SSHL_DIR etc.), not tmux
# formats (#{@info_script}), because display-popup does NOT expand
# format strings inside its shell-command. The launcher pushes the
# paths into tmux's global environment via set-environment -g, and
# popup shells inherit that env when they spawn.
#
# -EE closes a popup only when its command succeeds, so a failure stays
# on screen until you press Esc. SSHL_POPUP=1 makes the scripts say so.
#
# Status-bar segments still use #{@var}, which DOES expand because
# status-format is documented as a format string.

# `<prefix> H` Fuzzy host picker, jumps to the matching window.
bind-key H display-popup -EE -w 70% -h 60% '"$SSHL_PICKER"'

# `<prefix> S` Scan, then tick CURRENT rows to remove and NEW rows to add.
bind-key S display-popup -EE -w 90% -h 90% 'SSHL_POPUP=1 "$SSHL_DIR/popup-scan.sh"'

# `<prefix> O` Reorder: hand-rolled keyboard TUI. Cursor + grab/drop
# model. On confirm, swaps the live windows into the new order.
bind-key O display-popup -EE -w 70% -h 90% 'SSHL_POPUP=1 "$SSHL_DIR/popup-reorder.sh"'

# `<prefix> I` Ignored: fzf multi-select over ignored.cache. Tick =
# un-ignore (returns the IP to scan-candidate status).
bind-key I display-popup -EE -w 70% -h 60% 'SSHL_POPUP=1 "$SSHL_DIR/popup-ignored.sh"'

# Two-row bar. Row 0 is the default layout (status-left + window list +
# status-right). Row 1 is a secondary info strip defined via
# `status-format[1]`.
set -g status 2
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# Palette: every color below references one of these codes. Swap
# them to re-theme the whole bar without touching layout. Preview any
# 256-color code with:  for i in {0..255}; do printf "\e[48;5;${i}m %3d " $i; done
#
# Current scheme (muted dark, orange accent):
#   bg=236   surface=238   fg=252   dim=244
#   accent=208   ok=114    warn=215   bad=203

# Overall bar + message style
set -g status-style          "bg=colour236,fg=colour252"
set -g message-style         "bg=colour208,fg=colour236,bold"
set -g message-command-style "bg=colour238,fg=colour252"

# Auto-pack window indices after a kill. Without this, removing a host
# via prefix S leaves a gap in the tab numbering until the next reorder
# triggers move-window -r.
set -g renumber-windows on

# Window tabs (the list of hosts in the middle)
set -g window-status-separator ""
set -g window-status-format          "#[bg=colour236,fg=colour244]  #I · #W  "
set -g window-status-current-format  "#[bg=colour208,fg=colour236,bold]  #I · #W  "
set -g window-status-activity-style  "bg=colour215,fg=colour236"
set -g window-status-bell-style      "bg=colour203,fg=colour236,bold"

# Row 0: session badge on the left, host info on the right
set -g status-left-length  40
set -g status-right-length 90
# Show the session *group* name rather than this konsole's grouped-
# session name. Base session is "homelab", and each attach gets a
# grouped session called "homelab-2", "-3", etc. #{session_group}
# collapses those back to the logical name we care about.
set -g status-left "#[bg=colour208,fg=colour236,bold]  #{?session_group,#{session_group},#S}  #[bg=colour236,fg=colour208]  "

# Right side: the host count only, so the tabs keep the width. The active
# host's IP is on row 1.
set -g status-right "#[fg=colour114]●#[default] #{session_windows} hosts  "

# Row 1: live info about the host the active window is sshed into.
# Left:  uptime + pending package updates (fetched by host-info.sh,
#        cached 24h per host so we don't SSH every 5s. The ↻ button
#        bypasses the TTL when you want a fresh check on demand).
# Right: dead-pane count across the session + total clients on the
#        server (counts konsoles, not just this grouped view).
#
# Notes:
#   - `##{pane_dead}` is intentional: inside #(…) a literal `#` must be
#     doubled to survive tmux format expansion.
#   - `#{@host_ip}` is window-scoped, so it auto-updates when you switch
#     windows. If empty (e.g. manually-created window), host-info.sh
#     prints nothing rather than erroring.
# The refresh range spans " ↻ " so a click need not hit one cell. Keep the
# space before it: in tmux 3.4 a range that starts right after #() is drawn
# one cell left of where clicks land.
set -g status-format[1] "#[bg=colour238,fg=colour252] #[fg=colour208]#{@host_name}#{?#{!=:#{@host_name},#{@host_ip}}, #[fg=colour244]#{@host_ip},}#[fg=colour252] #('#{@info_script}' '#{@host_user}' '#{@host_ip}') #[range=user|refresh,fg=colour208,bold] ↻ #[norange,fg=colour252,nobold]#[align=right]dead #(tmux list-panes -s -t '#S' -F '##{pane_dead}' 2>/dev/null | grep -c 1) #[fg=colour244]·#[fg=colour252] clients #(tmux list-clients 2>/dev/null | wc -l) "

# Status-line click dispatch: clicking the ↻ range refetches the host's
# info, ignoring the cache TTL. Any other status click falls through
# to the default (`select-window -t=`, which jumps to the clicked tab).
bind-key -T root MouseDown1Status {
    if -F '#{==:#{mouse_status_range},refresh}' {
        run-shell -b "'#{@info_script}' -f '#{@host_user}' '#{@host_ip}' >/dev/null 2>&1"
        display-message "refreshing #{@host_name}…"
    } {
        select-window -t=
    }
}

set -g mouse on
set -g history-limit 50000
setw -g aggressive-resize on
