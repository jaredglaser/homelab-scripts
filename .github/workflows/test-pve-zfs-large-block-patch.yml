name: Test pve-zfs-large-block-patch
on:
  push:
    branches: [main]
    paths: ['pve-zfs-large-block-patch/**', '.github/workflows/test-pve-zfs-large-block-patch.yml']
  # No paths filter: these checks are required, and a filtered workflow never
  # reports on a pull request outside its paths, which would block it.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pve-changes:
    name: pve-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pve: ${{ steps.diff.outputs.pve }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          pve=true
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$BASE...HEAD" > changed.txt
            cat changed.txt
            grep -qE '^(pve-zfs-large-block-patch/|\.github/workflows/test-pve-zfs-large-block-patch\.yml$)' changed.txt || pve=false
          fi
          echo "pve=$pve" | tee -a "$GITHUB_OUTPUT"

  pve-bats:
    name: pve-bats
    needs: pve-changes
    if: needs.pve-changes.outputs.pve == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck
      - name: Shellcheck the scripts, test stubs and e2e harness
        run: |
          shellcheck pve-zfs-large-block-patch/pve-zfs-large-block-patch.sh \
            pve-zfs-large-block-patch/install.sh \
            pve-zfs-large-block-patch/tests/bin/* \
            pve-zfs-large-block-patch/tests/stubs/* \
            pve-zfs-large-block-patch/tests/test_helper.bash \
            pve-zfs-large-block-patch/tests/setup_suite.bash \
            pve-zfs-large-block-patch/tests/e2e/*.sh
          shellcheck -S warning pve-zfs-large-block-patch/tests/*.bats
      - name: Run the bats suite
        run: bats pve-zfs-large-block-patch/tests/

  pve-e2e:
    name: pve-e2e
    needs: pve-changes
    if: needs.pve-changes.outputs.pve == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: End-to-end check with this commit's installer
        run: pve-zfs-large-block-patch/tests/e2e/run.sh
      # raw.githubusercontent.com can serve the previous main for a few minutes.
      - name: Wait until main's raw files match this commit
        if: github.event_name == 'push' && github.repository == 'jaredglaser/homelab-scripts'
        run: |
          base=https://raw.githubusercontent.com/jaredglaser/homelab-scripts/main/pve-zfs-large-block-patch
          for _ in $(seq 20); do
            if curl -fsSL --max-time 30 "$base/install.sh" | cmp -s - pve-zfs-large-block-patch/install.sh &&
               curl -fsSL --max-time 30 "$base/pve-zfs-large-block-patch.sh" | cmp -s - pve-zfs-large-block-patch/pve-zfs-large-block-patch.sh; then
              exit 0
            fi
            sleep 30
          done
          echo "raw.githubusercontent.com still serves different files for main after 10 minutes" >&2
          exit 1
      - name: End-to-end check with the README's one-liners
        if: github.event_name == 'push' && github.repository == 'jaredglaser/homelab-scripts'
        run: pve-zfs-large-block-patch/tests/e2e/run.sh --one-liner
